<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Galerie – Japonsko</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/x-icon" href="img/favicon.ico">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<header>
  <nav>
    <ul>
      <li><a href="index.html">Domů</a></li>
      <li><a href="form.html">Přihláška</a></li>
      <li><a href="bootstrap.html" class="active">Galerie</a></li>
    </ul>
  </nav>
</header>

<main class="container mt-5">
  <h1 class="text-center mb-4">Galerie Japonska 🇯🇵</h1>
  <div class="row g-4">
    <div class="col-md-4"><img src="img/tokyo.jpg" alt="Tokio" class="gallery-img"><p>Tokio</p></div>
    <div class="col-md-4"><img src="img/kyoto.jpg" alt="Kjóto" class="gallery-img"><p>Kjóto</p></div>
    <div class="col-md-4"><img src="img/osaka.jpg" alt="Ósaka" class="gallery-img"><p>Ósaka</p></div>
    <div class="col-md-6"><img src="img/hokkaido.jpg" alt="Hokkaidó" class="gallery-img"><p>Hokkaidó</p></div>
    <div class="col-md-6"><img src="img/okinawa.jpg" alt="Okinawa" class="gallery-img"><p>Okinawa</p></div>
  </div>
</main>

<div id="welcome" class="banner">
  <div class="banner-box">
    <h2>Vítejte v Japonsku!</h2>
    <p>Prohlédněte si ty nejkrásnější místa země vycházejícího slunce.</p>
    <button onclick="hideBanner()">Pokračovat</button>
  </div>
</div>

<footer>&copy; 2025 Cestování po Japonsku</footer>

<script>
function hideBanner() {
  const banner = document.getElementById('welcome');
  banner.style.opacity = '0';
  setTimeout(() => banner.style.display = 'none', 600);
}
</script>
</body>
</html>
